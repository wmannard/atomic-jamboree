# Rewrite app routes to the single-build app.
# The app resolves its config from query params at runtime.

[[redirects]]
  from = "/search"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/listing*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/pdp/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/recs*"
  to = "/app.html"
  status = 200

# Backwards compatibility: redirect old URLs to new format
[[redirects]]
  from = "/jamboree_:num/:locale/*"
  to = "/:splat?tracking_id=jamboree_:num&locale=:locale"
  status = 301

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
